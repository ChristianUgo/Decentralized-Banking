name: Feature or stage task
description: Plan a scoped product, protocol or engineering change
title: "[Scope]: "
labels:
  - enhancement
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe the user or protocol outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable completion conditions.
      placeholder: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and gas considerations
      description: Record value movement, trust, arithmetic, access-control and gas implications.
    validations:
      required: true

